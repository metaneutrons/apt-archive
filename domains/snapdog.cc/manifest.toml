[domain]
layout = "shared-root-v1"
host = "deb.snapdog.cc"
base_url = "https://deb.snapdog.cc"
origin = "SnapDogRocks"
keyring_package = "snapdog-archive-keyring"
keyring_file = "/usr/share/keyrings/snapdog-archive-keyring.pgp"

[signing]
primary_fingerprint = "1B7B79417383648BBFBE282E01AB8296EF0FCD76"
signing_subkey = "CFE7BACA652DD0D72EB7156FC7252FAD41F8F7DA"

[publication]
r2_bucket = "deb-snapdog-cc"
r2_account_id = "9122b44fa4c05b23985d6a0b779caa01"

[release]
suite = "rolling"
codename = "rolling"
components = ["main"]
architectures = ["amd64", "arm64"]
acquire_by_hash = true
valid_until_days = 180

# snapdog ships two binary packages from one release, hence the two names here.
# The renderer indexes whatever sits in the pool and can therefore handle
# several packages per architecture and several versions at once.
[[projects]]
name = "snapdog"
source_repo = "SnapDogRocks/snapdog"
packages = ["snapdog", "snapdog-client"]
# How many releases are kept in the pool. Without a limit it grows without
# bound and every run downloads everything again.
#
# Two rather than five: snapdog attached .deb files to its releases before it
# attested them. Attestation began with the v0.27.5 pipeline, so v0.27.4 and
# older carry packages the ingest refuses, and refuses rightly:
#
#   AR180 attestation verification failed for snapdog-client_0.27.4-1_amd64.deb
#
# Attestation cannot be added afterwards, it binds to a workflow run. v0.27.5
# and v0.27.7 have no release and v0.27.6 is a prerelease, so v0.27.8 is the
# oldest attested stable release. Two keep v0.28.0 and v0.27.8 once v0.28.0 is
# stable; five is safe again once five stable releases from v0.27.8 on exist.
keep_versions = 2
