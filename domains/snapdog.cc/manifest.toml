[domain]
host = "deb.snapdog.cc"
base_url = "https://deb.snapdog.cc"
origin = "SnapDogRocks"
keyring_package = "snapdog-archive-keyring"
keyring_file = "/usr/share/keyrings/snapdog-archive-keyring.pgp"

[signing]
primary_fingerprint = "1B7B79417383648BBFBE282E01AB8296EF0FCD76"
signing_subkey = "CFE7BACA652DD0D72EB7156FC7252FAD41F8F7DA"

[publication]
r2_bucket = "deb-snapdog-cc"
r2_account_id = "9122b44fa4c05b23985d6a0b779caa01"

[release]
suite = "rolling"
codename = "rolling"
components = ["main"]
architectures = ["amd64", "arm64"]
acquire_by_hash = true
valid_until_days = 180

# snapdog liefert zwei Binaerpakete aus einem Release, deshalb stehen hier zwei
# Namen. Der Renderer indexiert, was im Pool liegt, und kann daher mehrere
# Pakete je Architektur und mehrere Versionen gleichzeitig.
[[projects]]
name = "snapdog"
prefix = "/snapdog"
source_repo = "SnapDogRocks/snapdog"
packages = ["snapdog", "snapdog-client"]
# Anzahl der jeweils behaltenen Releases im Pool. Ohne Grenze waechst er
# unbegrenzt und jeder Lauf laedt alles neu.
keep_versions = 5
