# Ein Archiv-Domain-Manifest. Alles Domain-Spezifische steht hier, der Renderer
# und die Workflows sind gemeinsam. Eine spaetere Abspaltung verschiebt dieses
# Verzeichnis in ein eigenes Repository, ohne dass Code mitwandert.

[domain]
host = "deb.metaneutrons.cc"
base_url = "https://deb.metaneutrons.cc"
origin = "metaneutrons"
keyring_package = "metaneutrons-archive-keyring"
keyring_file = "/usr/share/keyrings/metaneutrons-archive-keyring.pgp"

[signing]
# Primaerschluessel ist certify-only und bleibt offline. Signiert wird mit dem
# Domain-Subkey, gepinnt per abschliessendem Ausrufezeichen. Beide Werte werden
# bei der Schluesselerzeugung eingetragen und danach nur bei Rotation geaendert.
primary_fingerprint = "1B7B79417383648BBFBE282E01AB8296EF0FCD76"
signing_subkey = "A0C21782FC507CCBD666F3ED242072FEC8BE54A4"

[publication]
r2_bucket = "deb-metaneutrons-cc"
r2_account_id = "9122b44fa4c05b23985d6a0b779caa01"

[release]
suite = "rolling"
codename = "rolling"
components = ["main"]
architectures = ["amd64", "arm64"]
acquire_by_hash = true
valid_until_days = 180

# Jedes Projekt bekommt ein eigenes Praefix und damit eine eigene
# Valid-Until-Uhr. Ein vernachlaessigtes Projekt reisst so nicht die uebrigen mit.
[[projects]]
name = "aros-tools"
prefix = "/aros-tools"
source_repo = "metaneutrons/aros-tools"
packages = ["aros-tools"]
# Anzahl der jeweils behaltenen Releases im Pool. Ohne Grenze waechst er
# unbegrenzt und jeder Lauf laedt alles neu.
keep_versions = 5

[[projects]]
# Das Repository heisst devserial, und der Debian-Paketname war nie
# devserial-mcp. Beide Felder werden geprueft: publish.yml den Projektnamen
# gegen dieses Manifest, select_assets.py das Paket gegen die Release-Assets.
name = "devserial"
prefix = "/devserial"
source_repo = "metaneutrons/devserial"
packages = ["devserial"]
# Anzahl der jeweils behaltenen Releases im Pool. Ohne Grenze waechst er
# unbegrenzt und jeder Lauf laedt alles neu.
keep_versions = 5

[[projects]]
name = "ugos-cli"
prefix = "/ugos-cli"
source_repo = "metaneutrons/ugos-cli"
packages = ["ugos-cli"]
# Anzahl der jeweils behaltenen Releases im Pool. Ohne Grenze waechst er
# unbegrenzt und jeder Lauf laedt alles neu.
keep_versions = 5

[[projects]]
# Repository, Crate und Debian-Paket heissen hier alle bups. Die glibc-Pakete
# entstehen nativ je Architektur in einem digest-gepinnten Bookworm-Container,
# der Dateiname traegt deshalb amd64 beziehungsweise arm64 und keine
# Debian-Revision.
name = "bups"
prefix = "/bups"
source_repo = "metaneutrons/bups"
packages = ["bups"]
# Anzahl der jeweils behaltenen Releases im Pool. Ohne Grenze waechst er
# unbegrenzt und jeder Lauf laedt alles neu.
keep_versions = 5
