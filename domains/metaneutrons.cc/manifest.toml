# An archive domain manifest. Everything domain-specific lives here, the
# renderer and the workflows are shared. A later split moves this directory into
# a repository of its own without any code travelling with it.

[domain]
layout = "shared-root-v1"
host = "deb.metaneutrons.cc"
base_url = "https://deb.metaneutrons.cc"
origin = "metaneutrons"
keyring_package = "metaneutrons-archive-keyring"
keyring_file = "/usr/share/keyrings/metaneutrons-archive-keyring.pgp"

[signing]
# The primary key is certify-only and stays offline. Signing happens with the
# domain subkey, pinned by a trailing exclamation mark. Both values are entered
# at key creation and changed afterwards only on rotation.
primary_fingerprint = "1B7B79417383648BBFBE282E01AB8296EF0FCD76"
signing_subkey = "A0C21782FC507CCBD666F3ED242072FEC8BE54A4"

[publication]
r2_bucket = "deb-metaneutrons-cc"
r2_account_id = "9122b44fa4c05b23985d6a0b779caa01"

[release]
suite = "rolling"
codename = "rolling"
components = ["main"]
architectures = ["amd64", "arm64"]
acquire_by_hash = true
valid_until_days = 180

# A project owns disjoint package names, not a URL prefix. All projects of this
# domain share one pool, one dists/rolling and therefore one clock: every
# publication refreshes the validity of the whole archive, unchanged packages
# included.
[[projects]]
name = "aros-tools"
source_repo = "metaneutrons/aros-tools"
packages = ["aros-tools"]
# How many releases are kept in the pool. Without a limit it grows without
# bound and every run downloads everything again.
keep_versions = 5

[[projects]]
# The repository is called devserial, and the Debian package name was never
# devserial-mcp. Both fields are checked: publish.yml checks the project name
# against this manifest, select_assets.py checks the package against the release
# assets.
name = "devserial"
source_repo = "metaneutrons/devserial"
packages = ["devserial"]
# How many releases are kept in the pool. Without a limit it grows without
# bound and every run downloads everything again.
keep_versions = 5

[[projects]]
name = "ugos-cli"
source_repo = "metaneutrons/ugos-cli"
packages = ["ugos-cli"]
# How many releases are kept in the pool. Without a limit it grows without
# bound and every run downloads everything again.
#
# Two rather than five: ugos-cli attached .deb files to its releases before it
# attested them. Attestation began with v0.11.3, so v0.11.2 and older carry
# packages the ingest refuses, and refuses rightly:
#
#   AR180 attestation verification failed for ugos-cli_0.11.2_amd64.deb
#
# Attestation cannot be added afterwards, it binds to a workflow run. A window
# of two keeps the ingest on the attested releases and moves past the old ones
# as the project releases further.
keep_versions = 2

[[projects]]
# Repository, crate and Debian package are all called bups here. The glibc
# packages are built natively per architecture in a digest-pinned Bookworm
# container, so the file name carries amd64 or arm64 and no Debian revision.
name = "bups"
source_repo = "metaneutrons/bups"
packages = ["bups"]
# How many releases are kept in the pool. Without a limit it grows without
# bound and every run downloads everything again.
keep_versions = 5
