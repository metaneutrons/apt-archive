name: Publish

# One import per project; every run publishes the whole domain inventory.
#
# repository_dispatch is how a project knocks after its release, and how the
# external watchdog asks for a re-signature. No cron: GitHub switches scheduled
# workflows off in public repositories after 60 days without a commit, and this
# repository is commit-poor.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Archive domain
        required: true
        type: choice
        options:
          - metaneutrons.cc
          - snapdog.cc
      project:
        description: Project name from the manifest (empty = re-sign the whole inventory)
        required: false
        type: string
      retire_project:
        description: Declared one-shot project retirement (cannot be combined with project)
        required: false
        type: string
  repository_dispatch:
    types: [publish-archive]

permissions:
  contents: read

# One bucket, one writer. Two runs at once could interleave the phases and put
# signed metadata down before their packages.
concurrency:
  group: publish-${{ github.event.inputs.domain || github.event.client_payload.domain }}
  cancel-in-progress: false
  # A new run must not displace a run of another publication of the same
  # domain that is already waiting. Up to 100 requests queue up; writing still
  # happens strictly one at a time.
  queue: max

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One environment per domain. The standard names a single `release`, which
    # holds for a project repository; here there are two keys and two buckets,
    # and a run for one domain must not be able to read the other one's
    # credentials.
    environment: release-${{ github.event.inputs.domain || github.event.client_payload.domain }}
    outputs:
      domain: ${{ steps.resolve.outputs.domain }}
      project: ${{ steps.resolve.outputs.project }}
      retire_project: ${{ steps.resolve.outputs.retire_project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned Rust archive tool
        run: cargo build --release --locked

      - name: Resolve and validate the request
        id: resolve
        env:
          # Through env only, never interpolated: a client_payload comes from
          # outside and would otherwise be a shell injection vector.
          IN_DOMAIN: ${{ github.event.inputs.domain || github.event.client_payload.domain }}
          IN_PROJECT: ${{ github.event.inputs.project || github.event.client_payload.project }}
          IN_RETIRE_PROJECT: ${{ github.event.inputs.retire_project }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$IN_DOMAIN" in
            metaneutrons.cc|snapdog.cc) ;;
            *) echo "::error::unknown domain '$IN_DOMAIN'"; exit 1 ;;
          esac
          if [[ -n "$IN_PROJECT" ]]; then
            printf '%s\n' "$IN_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{1,63}$' \
              || { echo "::error::unsafe project name"; exit 1; }
          fi
          if [[ -n "$IN_RETIRE_PROJECT" ]]; then
            printf '%s\n' "$IN_RETIRE_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]{1,63}$' \
              || { echo "::error::unsafe retirement project name"; exit 1; }
          fi
          manifest="domains/${IN_DOMAIN}/manifest.toml"
          [ -f "$manifest" ] || { echo "::error::no manifest for $IN_DOMAIN"; exit 1; }
          if [[ -n "$IN_RETIRE_PROJECT" ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch && -z "$IN_PROJECT" ]] \
              || { echo "::error::retirement requires a manual dispatch without an import"; exit 1; }
            args=(validate-retirement --manifest "$manifest" --project "$IN_RETIRE_PROJECT")
          else
            args=(validate-request --manifest "$manifest")
            [ -n "$IN_PROJECT" ] && args+=(--project "$IN_PROJECT")
          fi
          target/release/apt-archive-tool "${args[@]}"
          {
            printf 'domain=%s\n' "$IN_DOMAIN"
            printf 'project=%s\n' "$IN_PROJECT"
            printf 'retire_project=%s\n' "$IN_RETIRE_PROJECT"
          } >> "$GITHUB_OUTPUT"

      - name: Every value the run needs is present and well formed
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Presence and shape only, never the value or metadata derived from it.
          for name in APT_GPG_PRIVATE_KEY APT_GPG_PASSPHRASE \
                      R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || { echo "::error::$name is not set in this environment"; exit 1; }
            printf '  %s present\n' "$name"
          done
          printf '%s' "$APT_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY BLOCK' \
            || { echo '::error::APT_GPG_PRIVATE_KEY is not an armored private key block'; exit 1; }
          printf '  the key block is armored\n'
          # That this is an export of the subkeys *only* is checked by
          # verify-signing-bundle.sh on the imported material. From the outside
          # the armor does not show it.

      - name: The bucket answers and nothing is written
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Check the target values strictly and without credentials first.
          # Only then may the read-only bucket check use the environment
          # secrets.
          MANIFEST="domains/${{ steps.resolve.outputs.domain }}/manifest.toml"
          target=$(target/release/apt-archive-tool target --manifest "$MANIFEST") \
            || { echo '::error::invalid R2 publication target'; exit 1; }
          IFS=$'\t' read -r bucket account <<< "$target"
          AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
          AWS_DEFAULT_REGION=auto \
          AWS_EC2_METADATA_DISABLED=true \
          aws s3api head-bucket --bucket "$bucket" \
            --endpoint-url "https://${account}.r2.cloudflarestorage.com" \
            || { echo "::error::cannot reach bucket $bucket"; exit 1; }
          printf '  bucket %s reachable\n' "$bucket"

  publish:
    name: Fetch, render, sign, publish, verify
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-${{ needs.preflight.outputs.domain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned Rust archive tool
        run: cargo build --release --locked

      - name: Acquire the pinned cosign verifier for ami-rust
        if: needs.preflight.outputs.project == 'ami-rust'
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --max-time 120 --max-filesize 141178250 \
            --output "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          test "$(wc -c < "$RUNNER_TEMP/cosign")" = 141178250
          printf '%s  %s\n' \
            4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 \
            "$RUNNER_TEMP/cosign" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/cosign"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Fetch the packages and verify their attestation
        if: needs.preflight.outputs.project != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/fetch-packages.sh \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --project "${{ needs.preflight.outputs.project }}" \
            --pool-dir "$RUNNER_TEMP/incoming"

      - name: Restore the signed domain and merge only the requested import
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          IN_PROJECT: ${{ needs.preflight.outputs.project }}
          IN_RETIRE_PROJECT: ${{ needs.preflight.outputs.retire_project }}
        run: |
          set -euo pipefail
          import_args=()
          if [[ -n "$IN_PROJECT" ]]; then
            import_args=(--project "$IN_PROJECT" --incoming-pool "$RUNNER_TEMP/incoming")
          elif [[ -n "$IN_RETIRE_PROJECT" ]]; then
            import_args=(--retire-project "$IN_RETIRE_PROJECT")
          fi
          target/release/apt-archive-tool snapshot-prepare \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --output-pool "$RUNNER_TEMP/pool" --baseline "$RUNNER_TEMP/baseline.json" \
            "${import_args[@]}"

      - name: Render the archive
        run: |
          set -euo pipefail
          # Created internally and only after the fetch and the environment
          # approval: neither a dispatch caller nor the re-sign watchdog
          # supplies this clock.
          publication_epoch=$(date -u +%s)
          printf 'publication epoch %s\n' "$publication_epoch"
          printf 'PUBLICATION_EPOCH=%s\n' "$publication_epoch" >> "$GITHUB_ENV"
          ./scripts/render-archive.sh \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --pool-dir "$RUNNER_TEMP/pool" \
            --output-dir "$RUNNER_TEMP/archive" \
            --publication-epoch "$publication_epoch"

      - name: Sign it
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/signing.asc"
          pass="$RUNNER_TEMP/signing.pass"
          # Both files disappear even on an abort.
          trap 'rm -f -- "$key" "$pass"' EXIT
          umask 077
          printf '%s' "$APT_GPG_PRIVATE_KEY" > "$key"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$pass"
          ./scripts/sign-archive.sh \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --archive-dir "$RUNNER_TEMP/archive" \
            --private-key "$key" --passphrase-file "$pass" \
            --publication-epoch "$PUBLICATION_EPOCH"

      - name: Publish it, objects before metadata
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./scripts/publish-archive.sh \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --archive-dir "$RUNNER_TEMP/archive" \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --publication-epoch "$PUBLICATION_EPOCH"

      - name: Verify what a client receives
        run: |
          set -euo pipefail
          # Against the public URL, not against the bucket: what is checked is
          # what gets served.
          ./scripts/verify-publication.sh \
            --manifest "domains/${{ needs.preflight.outputs.domain }}/manifest.toml" \
            --archive-dir "$RUNNER_TEMP/archive" \
            --publication-epoch "$PUBLICATION_EPOCH"
