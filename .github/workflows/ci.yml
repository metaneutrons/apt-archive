name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust publisher and shell boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust format, lint and contracts
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked

      - name: Production shell boundaries
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck -S warning
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          interpreter='py''thon'
          script_suffix='\.'"'py'"
          if grep -REn "(^|[^[:alnum:]_])${interpreter}3?([^[:alnum:]_]|$)|${script_suffix}([^[:alnum:]_]|$)" \
              .github/workflows scripts; then
            echo '::error::the active publication path references a forbidden interpreter'
            exit 1
          fi

      - name: Domain manifests satisfy the Rust contract
        run: |
          set -euo pipefail
          for manifest in domains/*/manifest.toml; do
            target/release/apt-archive-tool validate-request --manifest "$manifest"
          done

  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR title, body and every commit are clean
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          ban='co-authored-by:.*(claude|anthropic)|generated with.*claude code'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::PR title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo '::error::PR body contains a prohibited AI attribution.'
            status=1
          fi
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha contains a prohibited AI attribution."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha uses a prohibited author or committer address."
              status=1
            fi
          done
          exit "$status"

  ci-success:
    name: CI success
    if: always()
    needs: [checks, commit-hygiene]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every preceding job must have succeeded or been skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
