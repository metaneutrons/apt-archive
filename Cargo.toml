[package]
name = "apt-archive-tool"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace]

[dependencies]
ar = "0.9.0"
bzip2 = "0.6.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.51", features = ["derive"] }
flate2 = "1.1.5"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.23.0"
toml = "0.9.8"
walkdir = "2.5.0"
xz2 = "0.1.7"
zstd = "0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
